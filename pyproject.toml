[project]
name = "funread"
version = "1.1.93"
description = "一个用于管理和处理阅读源（Legado 阅读 APP 的书源和 RSS 源）的 Python 工具库"
readme = "README.md"
requires-python = ">=3.12"
keywords = [ "legado", "reading", "book-source", "rss", "ebook",]
classifiers = [ "Development Status :: 4 - Beta", "Intended Audience :: Developers", "License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.12", "Topic :: Software Development :: Libraries :: Python Modules", "Topic :: Text Processing :: Markup",]
dependencies = [ "dominate>=2.9.1", "fundrive>=2.0.81", "funfake>=1.1.5", "funfile>=1.0.39", "farlog>=1.1.6", "funsecret>=1.4.88", "nlttask>=1.0.3", "requests>=2.28.0", "SQLAlchemy>=2.0.0", "PyMySQL>=1.1.0", "tqdm>=4.67.0",]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project.license]
text = "Apache-2.0"

[project.optional-dependencies]
dev = [ "pytest>=7.0.0", "pytest-cov>=4.0.0", "ruff>=0.1.0", "mypy>=1.0.0",]
web = [ "nicegui>=2.0.0", "pydantic>=2.0.0",]

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funread"
Releases = "https://github.com/farfarfun/funread/releases"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.setuptools]
license-files = []

[tool.ruff.lint]
select = [ "E", "F", "I", "N", "W",]
ignore = [ "E501",]

[tool.uv.sources.fundrive]
path = "../fundrive"
editable = true

[tool.uv.sources.funsecret]
path = "../funsecret"
editable = true
