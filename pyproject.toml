[project]
name = "funread"
version = "1.1.127"
description = "一个用于管理和处理阅读源（Legado 阅读 APP 的书源和 RSS 源）的 Python 工具库"
readme = "README.md"
requires-python = ">=3.11"
keywords = [ "legado", "reading", "book-source", "rss", "ebook",]
classifiers = ["Development Status :: 4 - Beta", "Intended Audience :: Developers", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.12", "Topic :: Software Development :: Libraries :: Python Modules", "Topic :: Text Processing :: Markup"]
dependencies = [ "dominate>=2.9.1", "funfake>=1.1.5", "funfile>=1.0.39", "farlog>=1.1.7", "funsecret>=1.4.88", "funworker>=0.1.3", "requests>=2.28.0", "SQLAlchemy>=2.0.0", "PyMySQL>=1.1.0", "psycopg2-binary>=2.9.10", "tqdm>=4.67.0",]
license = "MIT"
license-files = ["LICENSE"]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"
[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project.optional-dependencies]
parse = [ "lxml>=5.1.0", "cssselect>=1.2.0", "jsonpath-ng>=1.6.1", "charset-normalizer>=3.0.0",]
js = [ "quickjs>=1.19.4",]
reader = [ "funread[parse]",]
publish = [ "fundrive>=2.0.81; python_version >= '3.12'",]

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funread"
Releases = "https://github.com/farfarfun/funread/releases"

[dependency-groups]
dev = [ "pytest>=8.0.0", "pytest-cov>=4.0.0", "ruff>=0.1.0", "mypy>=1.0.0", "httpx2>=2.0.0",]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.setuptools]

[tool.ruff.lint]
select = [ "E", "F", "I", "N", "W",]
ignore = [ "E501",]

[tool.ruff.lint.isort]
# funread is this package. Ruff also finds it installed in site-packages and
# would otherwise sort absolute `from funread.base.config import ...` in with
# the third-party block.
known-first-party = ["funread"]

[tool.ruff.lint.per-file-ignores]
# **临时豁免，删掉这一条就是验收标准。**
#
# builder.py 用 `from dominate.tags import *` 建 HTML 报告，于是 49 条
# F403/F405 —— 静态分析认不出 li / a / div 这些名字从哪来。它同时还是**零测试
# 覆盖**的：tests/test_download_base.py 里那个 `_ReportBuilder` 是个假类，真正
# 的 SourceReportBuilder（167 行，在 context.py:40 的生产路径上）一行都没被跑过。
#
# 不在这里顺手改，是因为项目台账把它记成了一次独立的带测试清理
# （project-status.yaml 的 risks，due 2026-11-15）：star-import 的名字解析不可
# 静态验证，改它必须同时补测试，混进别的改动里风险更高。
#
# 豁免写在这儿而不是干脆不跑 ruff：这样 CI 能覆盖其余所有文件，而这个文件欠的
# 债是显式的、有位置、有验收标准的 —— 清理完把这一节删掉，CI 自动接管。
"src/funread/legado/manage/download/reporting/builder.py" = ["F403", "F405"]
